name: Notify docs-site
on:
  push:
    branches: [master]
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch to docs-site
        run: |
          curl -sSL -X POST \
            -H "Authorization: Bearer ${{ secrets.DOCS_SITE_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bomeravi/docs-site/dispatches \
            -d '{"event_type":"docs-updated"}'